---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: bggdb-deploy
  namespace: bggns
spec:
  replicas: 1
  selector:
    matchLabels:
      env: dev
      name: bggdb
  template:
    metadata: 
      labels:
        env: dev
        name: bggdb
    spec:
      containers:
        - name: bggdb-deploy
          image: stackupiss/bgg-database:v1
          imagePullPolicy: IfNotPresent
          ports:
          - name: bggdb-port
            containerPort: 3306    
            
---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc 
  namespace: bggns
spec:
  type: ClusterIP
  selector:
    name: bggdb
    env: dev
  ports:
    - name: http
      port: 3306
      targetPort: 3306
      protocol: TCP
