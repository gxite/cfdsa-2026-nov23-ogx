--- 
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name:  bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      env: dev
      name: bggapp
  template:
    metadata: 
      labels:
        env: dev
        name: bggapp
    spec:
      containers:
        - name: bggapp-deploy 
          image: stackupiss/bgg-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
          - name: bggapp-port
            containerPort: 3000
          env:
          - name: BGG_DB_USER
            valueFrom:
              configMapKeyRef: 
                name: bggapp-cm
                key: bgg_db_user
          - name: BGG_DB_HOST
            valueFrom:
              configMapKeyRef: 
                name: bggapp-cm
                key: bgg_db_host
          - name: BGG_DB_PASSWORD
            valueFrom:
              secretKeyRef: 
                name: bggapp-secret
                key: bgg_db_password
          livenessProbe:
            httpGet: 
              path: /healthz
              port: bggapp-port
            failureThreshold: 3
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: 
              path: /healthz
              port: bggapp-port
            failureThreshold: 3
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc 
  namespace: bggns
spec:
  type: NodePort
  selector:
    name: bggapp
    env: dev
  ports:
    - name: http
      port: 8080
      targetPort: 3000
      protocol: TCP